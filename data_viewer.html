<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问卷数据管理 · ChatGPT辅助教学调查</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; color: #1a1a1a; line-height: 1.6;
}
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

.header {
  background: linear-gradient(135deg, #1a5276 0%, #6c3483 100%);
  color: #fff; padding: 32px; border-radius: 16px; margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(26,82,118,0.2);
}
.header h1 { font-size: 22px; margin-bottom: 8px; }
.header p { opacity: 0.85; font-size: 14px; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center;
}
.btn {
  padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px;
}
.btn-primary { background: #2e86c1; color: #fff; }
.btn-primary:hover { background: #2471a3; }
.btn-green { background: #27ae60; color: #fff; }
.btn-green:hover { background: #219a52; }
.btn-purple { background: #8e44ad; color: #fff; }
.btn-purple:hover { background: #7d3c98; }
.btn-outline { background: #fff; color: #555; border: 2px solid #ddd; }
.btn-outline:hover { border-color: #999; }
.btn-danger { background: #e74c3c; color: #fff; }
.btn-danger:hover { background: #c0392b; }
.btn-danger:disabled { background: #f5b7b1; cursor: not-allowed; }

.data-table th.cb-col, .data-table td.cb-col {
  width: 40px; text-align: center; padding: 8px 4px;
}
.data-table th.cb-col input[type="checkbox"],
.data-table td.cb-col input[type="checkbox"] {
  cursor: pointer; width: 16px; height: 16px; accent-color: #2e86c1;
}

.tabs {
  display: flex; gap: 4px; background: #e0e4e8; padding: 4px; border-radius: 12px;
  margin-bottom: 20px;
}
.tab {
  flex: 1; padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px;
  font-weight: 600; cursor: pointer; background: transparent; color: #666; transition: .2s;
}
.tab.active { background: #fff; color: #1a5276; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

.card {
  background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card h3 { font-size: 16px; color: #333; margin-bottom: 12px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  text-align: center;
}
.stat-card .value { font-size: 32px; font-weight: 700; color: #1a5276; }
.stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

table.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.data-table th {
  background: #f7f9fc; padding: 10px 8px; text-align: left; font-weight: 600;
  color: #555; border-bottom: 2px solid #e0e4e8; white-space: nowrap;
}
.data-table td {
  padding: 8px; border-bottom: 1px solid #f0f2f5; color: #444;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis;
}
.data-table tr:hover td { background: #f8fafc; }

.table-wrap { overflow-x: auto; }

.empty-state {
  text-align: center; padding: 60px 20px; color: #999;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

.summary-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #f0f2f5; font-size: 13px;
}
.summary-item .question { color: #444; flex: 1; }
.summary-item .mean {
  background: #eaf4fb; color: #2e86c1; padding: 2px 10px; border-radius: 12px;
  font-weight: 600; font-size: 13px; margin-left: 12px;
}

.spss-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
.spss-table th { background:#1a5276; color:#fff; padding:8px; text-align:center; font-size:11px; }
.spss-table td { padding:7px 6px; text-align:center; border-bottom:1px solid #f0f2f5; }
.spss-table td.left { text-align:left; }
.spss-table .module-row td { background:#f0f5fa; font-weight:700; text-align:left; padding:8px; font-size:13px; }
.spss-table .alpha { background:#e8f5e9; color:#27ae60; font-weight:700; }

.freq-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
.freq-table th { background:#f0f4f8; padding:8px 12px; text-align:left; font-weight:600; color:#555; border-bottom:2px solid #e0e4e8; }
.freq-table td { padding:7px 12px; border-bottom:1px solid #f0f2f5; }
.freq-table .cat-header td { background:#e8f0f8; font-weight:700; color:#1a5276; padding:10px 12px; }

/* Three-line table style */
.three-line-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  border-top: 2px solid #333; border-bottom: 2px solid #333;
}
.three-line-table thead th {
  border-bottom: 1px solid #333; padding: 8px 10px;
  text-align: center; font-weight: 600; color: #333;
  background: none;
}
.three-line-table tbody td {
  padding: 6px 10px; text-align: center; border: none;
  color: #444;
}
.three-line-table tbody td.cat {
  text-align: left; font-weight: 600; color: #1a5276;
  vertical-align: top;
}
.three-line-table .note-row td {
  font-size: 12px; color: #999; padding-top: 10px; text-align: left;
}
.freq-table .bar-cell { width:40%; }
.freq-table .bar-inner { height:20px; background:linear-gradient(90deg,#2e86c1,#74b9ff); border-radius:10px; transition:width .3s; min-width:4px; }

.hidden { display: none !important; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 12px 28px; border-radius: 24px;
  font-size: 14px; z-index: 2000; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 600px) {
  .container { padding: 12px; }
  .header { padding: 20px; }
  .toolbar { flex-direction: column; align-items: stretch; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Password Gate -->
<div class="overlay show" id="passwordGate" style="display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;">
  <div class="overlay-card" style="text-align:center;">
    <div class="icon">🔒</div>
    <h2 style="color:#1a5276;">数据管理</h2>
    <p style="font-size:13px;color:#888;margin-bottom:20px;">请输入管理密码</p>
    <form onsubmit="checkPassword();return false;">
      <input type="password" id="passwordInput" placeholder="请输入密码" style="padding:12px 16px;border:2px solid #ddd;border-radius:10px;font-size:15px;width:200px;text-align:center;" autofocus>
      <p id="pwError" style="color:#e74c3c;font-size:12px;margin-top:8px;display:none;">密码错误</p>
      <button type="submit" style="margin-top:16px;padding:10px 36px;background:#2e86c1;color:#fff;border:none;border-radius:24px;font-size:14px;cursor:pointer;">进入</button>
    </form>
  </div>
</div>

<div class="container" style="display:none;">
  <div class="header">
    <h1>📊 问卷数据管理</h1>
    <p>墨西哥城孔子学院 · ChatGPT辅助汉语教学接受度与需求调查</p>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('teacher')" id="tabTeacher">🧑‍🏫 教师问卷</button>
    <button class="tab" onclick="switchTab('student')" id="tabStudent">👩‍🎓 学生问卷</button>
  </div>

  <!-- Stats -->
  <div class="stat-grid" id="statGrid"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-green" onclick="exportCSV()">📥 导出 CSV</button>
    <button class="btn btn-purple" onclick="importData()">📤 导入数据 (JSON)</button>
    <button class="btn btn-outline" onclick="copyShareLink()">🔗 复制问卷链接</button>
    <button class="btn btn-danger" id="btnDeleteSelected" onclick="deleteSelected()" disabled style="margin-left:auto;">🗑️ 删除选中 (<span id="deleteCount">0</span>)</button>
    <button class="btn btn-danger" onclick="clearData()" style="margin-left:16px;">🗑️ 清空数据</button>
  </div>

  <!-- Data Table -->
  <div class="card">
    <h3 id="dataTitle">教师问卷 · 提交记录</h3>
    <div class="table-wrap" id="dataTable"></div>
    <div class="empty-state" id="emptyState">
      <div class="icon">📭</div>
      <p>暂无提交记录</p>
      <p style="font-size:12px;color:#bbb;">提交问卷后，记录将显示在此页面</p>
    </div>
  </div>

  <!-- Summary Statistics -->
  <div class="card" id="summaryCard">
    <h3>📈 量表统计（平均值）</h3>
    <div id="summaryContent"></div>
  </div>

  <!-- Charts -->
  <div class="card" id="chartCard">
    <h3>📊 统计图表</h3>
    <div class="toolbar" style="margin-bottom:16px;">
      <select id="moduleFilter" onchange="onModuleChange()" style="padding:8px 12px;border:2px solid #e0e4e8;border-radius:10px;font-size:14px;">
        <option value="all">全部题目</option>
      </select>
      <select id="chartType" onchange="renderChart()" style="padding:8px 12px;border:2px solid #e0e4e8;border-radius:10px;font-size:14px;">
        <option value="bar">柱状图</option>
        <option value="line">折线图</option>
      </select>
      <button class="btn btn-purple" onclick="exportChartImage()">🖼️ 导出图表为图片</button>
      <button class="btn btn-outline" onclick="exportSPSSReport()">📄 导出分析报告</button>
    </div>
    <div style="max-height:600px;overflow-y:auto;">
      <canvas id="likertChart" height="80"></canvas>
    </div>
  </div>

  <!-- SPSS Analysis -->
  <div class="card" id="spssCard">
    <h3>🔬 SPSS 风格描述性分析</h3>
    <div class="table-wrap" id="spssContent"></div>
  </div>

  <div class="card">
    <h3>🔧 问卷开关</h3>
    <div class="toolbar">
      <button id="btnTeacherToggle" class="btn btn-primary" onclick="toggleSurvey('teacher')" style="min-width:200px;">🧑‍🏫 教师问卷：检测中...</button>
      <button id="btnStudentToggle" class="btn btn-purple" onclick="toggleSurvey('student')" style="min-width:200px;">👩‍🎓 学生问卷：检测中...</button>
    </div>
    <p style="font-size:12px;color:#999;margin-top:8px;">关闭后填写者将看到"问卷暂停收集"页面，开启后恢复正常填写。</p>
  </div>

  <!-- 基础信息频数分析 -->
  <div class="card" id="freqCard">
    <h3>📋 基础信息频数分析</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-green" onclick="exportFreqDOCX()" style="font-size:12px;padding:6px 14px;">📝 导出 Word</button>
      <button class="btn btn-green" onclick="exportFreqExcel()" style="font-size:12px;padding:6px 14px;">📥 导出 Excel</button>
      <button class="btn btn-outline" onclick="exportFreqTXT()" style="font-size:12px;padding:6px 14px;">📄 导出 TXT</button>
    </div>
    <div class="table-wrap" id="freqContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==== JSONBin cloud config ====
const JSONBIN_KEY = '$2a$10$kZoAs0pS9hzA5rvrM10mDuq7y1ASxJlZoISmJIkBBSbic9jyQMJVu';
const JSONBIN_BI  = { teacher: '6a2e534cda38895dfebd6be2', student: '6a2e534df5f4af5e29eef0a9' };

// ==== Password protection ====
const PASSWORD = 'cdmx2026';
let authenticated = sessionStorage.getItem('survey_auth') === 'true';

if (authenticated) {
  document.querySelector('.container').style.display = 'block';
} else {
  document.querySelector('.container').style.display = 'none';
}

function checkPassword() {
  const pw = document.getElementById('passwordInput').value.trim();
  if (pw === PASSWORD) {
    sessionStorage.setItem('survey_auth', 'true');
    document.getElementById('passwordGate').style.display = 'none';
    document.querySelector('.container').style.display = 'block';
    renderAll();
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
  return false;
}

let currentTab = 'teacher';

// ==== Likert question labels ====
const teacherQuestions = [
  '了解ChatGPT基本功能', '使用过ChatGPT', '了解可用于辅助汉语教学',
  '能熟练向ChatGPT提问', '对AI教育工具接受度较高',
  'ChatGPT可提高备课效率', '可辅助生成教学材料', '可提供个性化学习支持',
  '可提高学生学习兴趣', '可促进教学方式创新',
  '操作方式比较简单', '容易融入日常教学', '不会明显增加教学负担',
  '能调整ChatGPT生成内容', '能判断内容是否适合课堂', '适合多教学环节',
  '快速生成课文/对话/阅读材料', '设计不同水平课堂活动', '生成词汇语法句型练习',
  '设计听说读写综合训练', '设计文化教学内容', '批改/反馈学生写作',
  '改进教学方案/教学反思', '生成本土化教学材料', '中西文化比较教学设计',
  '设计课堂评价/学习测评',
  '担心内容存在事实错误', '担心教学内容不够准确', '担心内容不符合学生水平',
  '担心削弱教学设计能力', '担心影响学生独立思考', '担心隐私/数据安全',
  '缺乏使用ChatGPT专业知识',
  '希望接受系统培训', '希望与其他教师交流经验', '希望建立AI教学资源库',
  '希望了解如何判断修改内容', '希望获得使用案例', '希望机构制定使用规范',
  '对汉语教学具有积极意义', '可以提升工作效率', '可以改善学习体验',
  '愿意持续关注应用', '愿意在合适环节使用', '有培训支持更愿意使用',
  '有必要进一步研究教学应用'
];

const studentQuestions = [
  '听说过ChatGPT', '知道可用于语言学习', '知道可帮助学习中文',
  '知道如何提出学习中文问题', '知道可解释词语语法句子', '知道可练习汉语对话',
  '知道回答不一定完全正确',
  '使用方法比较简单', '可容易提出中文学习问题', '可理解中文学习解释',
  '可调整提问方式', '比普通网页更方便', '比传统工具更灵活',
  '可随时随地帮助学习', '不理解内容时可寻求帮助', '初级学习者也可以使用',
  '愿意学习更有效使用',
  '理解听力材料中的词语', '整理听力材料主要内容', '解释听力练习难点',
  '根据听力内容复习',
  '进行简单中文对话练习', '准备课堂口语表达', '练习日常中文对话',
  '改正口语表达错误', '心理压力较小', '增加开口说中文机会',
  '理解中文课文', '解释阅读材料生词', '分析句子结构',
  '总结阅读材料主要意思', '理解文化内容',
  '修改中文句子', '发现写作语法错误', '学习更合适中文表达',
  '组织中文写作思路', '提高中文写作信心',
  '增加学习中文兴趣', '觉得学习更有趣', '更愿意用中文表达',
  '减少学习紧张感', '更有信心',
  '解释通常是准确的', '对初级学习者回答易理解', '能根据水平调整回答',
  '有时可能给出错误答案', '需要自己判断答案', '不清楚时会向老师确认',
  '回答质量影响继续使用意愿',
  '担心减少独立思考', '担心不认真听课', '担心错误回答影响学习',
  '不知如何判断回答正确', '做作业会影响学习效果', '不能理解初级学习者问题',
  '解释太难', '需要在老师指导下使用',
  '是有价值的学习工具', '符合当前学习需要', '对初级学习者比较友好',
  '能提高学习满意度', '可弥补传统课堂不足', '愿意接受辅助中文学习'
];

// ==== Module definitions ====
const teacherModules = [
  { name:'一、对ChatGPT的了解与使用情况', qStart:1, qEnd:5 },
  { name:'二、对ChatGPT教学价值的认知', qStart:6, qEnd:10 },
  { name:'三、使用ChatGPT的便利性与可操作性', qStart:11, qEnd:16 },
  { name:'四、实际教学需求', qStart:17, qEnd:26 },
  { name:'五、使用ChatGPT的顾虑', qStart:27, qEnd:33 },
  { name:'六、培训与支持需求', qStart:34, qEnd:39 },
  { name:'七、总体评价与未来使用意愿', qStart:40, qEnd:46 }
];
const studentModules = [
  { name:'I. Conocimiento sobre ChatGPT', qStart:1, qEnd:7 },
  { name:'II. Facilidad de uso percibida', qStart:8, qEnd:17 },
  { name:'III. Ayuda en habilidades (听/说/读/写)', qStart:18, qEnd:37 },
  { name:'IV. Interés y aprendizaje autónomo', qStart:38, qEnd:42 },
  { name:'V. Confianza y fiabilidad', qStart:43, qEnd:49 },
  { name:'VI. Riesgos y preocupaciones', qStart:50, qEnd:57 },
  { name:'VII. Satisfacción con el aprendizaje', qStart:58, qEnd:63 }
];

let currentModule = 'all';

function getModuleQuestions() {
  const modules = currentTab === 'teacher' ? teacherModules : studentModules;
  const qs = currentTab === 'teacher' ? teacherQuestions : studentQuestions;
  if (currentModule === 'all') return { qs, range: [1, qs.length] };
  const m = modules.find(m => m.name === currentModule);
  if (!m) return { qs, range: [1, qs.length] };
  return { qs: qs.slice(m.qStart-1, m.qEnd), range: [m.qStart, m.qEnd] };
}

function populateModuleFilter() {
  const sel = document.getElementById('moduleFilter');
  const modules = currentTab === 'teacher' ? teacherModules : studentModules;
  sel.innerHTML = '<option value="all">全部题目</option>';
  modules.forEach(m => {
    sel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
  });
  currentModule = 'all';
}

function onModuleChange() {
  currentModule = document.getElementById('moduleFilter').value;
  renderAll();
}
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(tab === 'teacher' ? 'tabTeacher' : 'tabStudent').classList.add('active');
  document.getElementById('dataTitle').textContent = (tab === 'teacher' ? '教师问卷' : '学生问卷') + ' · 提交记录';
  populateModuleFilter();
  renderAll();
}

// ==== Data access (cloud-first) ====
let cloudData = { teacher: [], student: [] };

function getStorageKey() { return currentTab === 'teacher' ? 'teacher_survey_responses' : 'student_survey_responses'; }

function getResponses() {
  const isValid = r => r && r.timestamp && !r._empty && !r._init && Object.keys(r.likert || {}).length > 0;
  const remote = (cloudData[currentTab] || []).filter(isValid);
  const local = JSON.parse(localStorage.getItem(getStorageKey()) || '[]').filter(isValid);
  const seen = new Set();
  const merged = [...remote, ...local].filter(r => {
    const key = r.timestamp + (r.age || '') + (r.gender || r.teachYears || '');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return merged;
}

function loadFromCloud(callback) {
  const bid = JSONBIN_BI[currentTab];
  fetch(`https://api.jsonbin.io/v3/b/${bid}/latest`, {
    headers: { 'X-Master-Key': JSONBIN_KEY }
  }).then(r => r.json()).then(j => {
    cloudData[currentTab] = (j.record || []).filter(r => !r._init);
    if (callback) callback();
  }).catch(() => {
    if (callback) callback(); // fallback to local only
  });
}

function renderAll() {
  loadFromCloud(() => {
    const responses = getResponses();
    renderStats(responses);
    renderTable(responses);
    renderSummary(responses);
    renderChart();
    renderSPSS(responses);
    renderFrequency(responses);
  });
}

function renderStats(responses) {
  const grid = document.getElementById('statGrid');
  if (responses.length === 0) {
    grid.innerHTML = '<div class="stat-card"><div class="value">0</div><div class="label">提交数量</div></div>';
    return;
  }
  const typeLabel = currentTab === 'teacher' ? '教师' : '学生';

  let avgAge = 0, sumAge = 0, ageCount = 0;
  responses.forEach(r => { if (r.age) { sumAge += parseInt(r.age) || 0; ageCount++; } });
  avgAge = ageCount > 0 ? Math.round(sumAge / ageCount) : '-';

  // Count completed Likert
  const avgCompletion = Math.round(responses.reduce((sum, r) => {
    const vals = Object.values(r.likert || {}).filter(v => v != null);
    const total = Object.keys(r.likert || {}).length || 1;
    return sum + (vals.length / total);
  }, 0) / responses.length * 100);

  grid.innerHTML = `
    <div class="stat-card"><div class="value">${responses.length}</div><div class="label">${typeLabel}问卷提交数</div></div>
    <div class="stat-card"><div class="value">${avgAge}</div><div class="label">平均年龄</div></div>

    <div class="stat-card"><div class="value">${new Date(responses[responses.length-1].timestamp).toLocaleDateString('zh-CN')}</div><div class="label">最近提交</div></div>
  `;
}

function renderChart() {
  const responses = getResponses();
  const { qs, range } = getModuleQuestions();
  const canvas = document.getElementById('likertChart');
  const ctx = canvas.getContext('2d');
  const type = document.getElementById('chartType').value;

  if (chartInstance) chartInstance.destroy();

  if (responses.length === 0) {
    canvas.parentElement.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">暂无数据可绘制图表</p><canvas id="likertChart" height="80"></canvas>';
    return;
  }

  const likertData = {};
  responses.forEach(r => {
    Object.entries(r.likert || {}).forEach(([k, v]) => {
      if (v == null) return;
      const qNum = parseInt(k.slice(1));
      if (qNum < range[0] || qNum > range[1]) return;
      if (!likertData[k]) likertData[k] = { sum: 0, count: 0, vals: [] };
      likertData[k].sum += v;
      likertData[k].count++;
      likertData[k].vals.push(v);
    });
  });

  const keys = Object.keys(likertData).sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
  const labels = keys.map(k => {
    const idx = parseInt(k.slice(1)) - range[0];
    return qs[idx] || 'Q' + k.slice(1);
  });
  const values = keys.map(k => {
    const d = likertData[k];
    return +(d.sum / d.count).toFixed(2);
  });

  const config = {
    type: type,
    data: {
      labels: labels,
      datasets: [{
        label: '均值',
        data: values,
        backgroundColor: type==='bar' ? 'rgba(46,134,193,0.6)' : 'transparent',
        borderColor: '#2e86c1',
        borderWidth: 2,
        pointBackgroundColor: '#2e86c1',
        pointRadius: 4,
        tension: 0.1,
        fill: false
      }]

    options: {
      responsive: true,
      maintainAspectRatio: false,

        legend: { display: false },
        tooltip: { callbacks: { label: ctx => '均值: ' + ctx.raw } }
      },
      scales: { y: { min: 0, max: 5, ticks: { stepSize: 1 } } }
    }
  };

  canvas.height = Math.max(400, keys.length * 28);
  chartInstance = new Chart(ctx, config);
}

// ==== SPSS Analysis ====
function renderSPSS(responses) {
  const container = document.getElementById('spssContent');
  if (responses.length === 0) {
    container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无数据</p>';
    return;
  }

  const modules = currentTab === 'teacher' ? teacherModules : studentModules;
  const allQs = currentTab === 'teacher' ? teacherQuestions : studentQuestions;
  const targetMods = currentModule === 'all' ? modules : modules.filter(m => m.name === currentModule);

  let html = `<table class="spss-table"><thead><tr>
    <th>题目</th><th>N</th><th>均值</th><th>中位数</th><th>标准差</th><th>最小值</th><th>最大值</th>
  </tr></thead><tbody>`;

  let grandAlphas = [];

  targetMods.forEach(mod => {
    html += `<tr class="module-row"><td colspan="7">${mod.name} (Q${mod.qStart}-Q${mod.qEnd})</td></tr>`;

    for (let qi = mod.qStart; qi <= mod.qEnd; qi++) {
      const k = 'q' + qi;
      const vals = responses.map(r => r.likert && r.likert[k]).filter(v => v !== null && v !== undefined);
      if (vals.length === 0) continue;
      vals.sort((a,b) => a-b);
      const n = vals.length;
      const meanNum = vals.reduce((s,v)=>s+v,0)/n;
      const medianNum = n%2===0 ? (vals[n/2-1]+vals[n/2])/2 : vals[Math.floor(n/2)];
      const variance = vals.reduce((s,v)=>s+(v-meanNum)*(v-meanNum),0)/n;
      const sdNum = Math.sqrt(variance);
      const label = allQs[qi-1] || 'Q'+qi;

      html += `<tr><td class="left">${label}</td><td>${n}</td><td>${meanNum.toFixed(2)}</td><td>${medianNum.toFixed(2)}</td><td>${sdNum.toFixed(2)}</td><td>${vals[0]}</td><td>${vals[n-1]}</td></tr>`;
    }

    // Cronbach's Alpha for this module
    const alpha = calcAlpha(responses, mod.qStart, mod.qEnd);
    if (alpha !== null) {
      html += `<tr><td class="left" style="font-weight:700;">Cronbach's α</td><td colspan="6" class="alpha">α = ${alpha.toFixed(3)} ${alpha>=0.7?'✅ 良好':'⚠️ 偏低'}</td></tr>`;
      grandAlphas.push(alpha);
    }
  });

  // Overall alpha when viewing all modules: calculate directly from all questions
  if (currentModule === 'all') {
    const maxQ = currentTab === 'teacher' ? 46 : 63;
    const overallAlpha = calcAlpha(responses, 1, maxQ);
    if (overallAlpha !== null) {
      html += `<tr class="module-row"><td colspan="7">整体 Cronbach's α (Q1-Q${maxQ}) = ${overallAlpha.toFixed(3)} ${overallAlpha>=0.7?'✅ 良好':'⚠️ 偏低'}</td></tr>`;
    }
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

function calcAlpha(responses, qStart, qEnd) {
  const k = qEnd - qStart + 1;
  if (k < 2) return null;

  // Listwise deletion: only respondents who answered ALL questions in range
  const matrix = [];
  responses.forEach(r => {
    const row = [];
    for (let qi = qStart; qi <= qEnd; qi++) {
      const v = r.likert && r.likert['q' + qi];
      if (v == null) return;
      row.push(v);
    }
    matrix.push(row);
  });

  const n = matrix.length;
  if (n < 2) return null;

  // Item variances
  let varItems = 0;
  for (let j = 0; j < k; j++) {
    const col = matrix.map(r => r[j]);
    const m = col.reduce((s, v) => s + v, 0) / n;
    varItems += col.reduce((s, v) => s + (v - m) * (v - m), 0) / n;
  }

  // Total score variance
  const totals = matrix.map(r => r.reduce((s, v) => s + v, 0));
  const totalMean = totals.reduce((s, v) => s + v, 0) / n;
  const varTotal = totals.reduce((s, v) => s + (v - totalMean) * (v - totalMean), 0) / n;

  if (varTotal === 0) return null;
  return (k / (k - 1)) * (1 - varItems / varTotal);
}

// ==== 基础信息频数分析（三线表） ====
function renderFrequency(responses) {
  const container = document.getElementById('freqContent');
  if (responses.length === 0) {
    container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无数据</p>';
    freqExportData = [];
    return;
  }
  const n = responses.length;
  freqExportData = [];

  function freqGroup(title, getter, isMulti) {
    const counts = {};
    let totalCount = 0;
    responses.forEach(r => {
      const vals = getter(r);
      if (isMulti) {
        (vals || []).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
        totalCount += (vals || []).length;
      } else {
        const v = vals || '(未填)';
        counts[v] = (counts[v] || 0) + 1;
        totalCount++;
      }
    });
    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const rows = sorted.map(([label, cnt]) => ({
      option: label,
      count: cnt,
      pct: totalCount > 0 ? (cnt / totalCount * 100).toFixed(1) : '0.0'
    }));
    freqExportData.push({ title, rows, totalCount });
    return rows;
  }

  const groups = [];

  if (currentTab === 'teacher') {
    groups.push({ title: '年龄', rows: freqGroup('年龄', r => {
      const age = parseInt(r.age) || 0;
      if (age <= 25) return '25岁及以下';
      if (age <= 30) return '26-30岁';
      if (age <= 35) return '31-35岁';
      if (age <= 40) return '36-40岁';
      if (age <= 50) return '41-50岁';
      return '50岁以上';
    }) });
    groups.push({ title: '教龄', rows: freqGroup('教龄', r => {
      const y = parseFloat(r.teachYears) || 0;
      if (y <= 1) return '1年及以下';
      if (y <= 3) return '1-3年';
      if (y <= 5) return '3-5年';
      if (y <= 10) return '5-10年';
      return '10年以上';
    }) });
    groups.push({ title: '性别', rows: freqGroup('性别', r => r.gender || '(未填)') });
    groups.push({ title: '教学对象（多选）', rows: freqGroup('教学对象（多选）', r => r.targetStudents || [], true) });
    groups.push({ title: '学生汉语水平（多选）', rows: freqGroup('学生汉语水平（多选）', r => r.studentLevel || [], true) });
    groups.push({ title: '墨西哥/拉美任教经验', rows: freqGroup('墨西哥/拉美任教经验', r => r.latinExp || '(未填)') });
    groups.push({ title: '授课语言（多选）', rows: freqGroup('授课语言（多选）', r => r.teachLang || [], true) });
    groups.push({ title: '学校类型', rows: freqGroup('学校类型', r => r.schoolType || '(未填)') });
    groups.push({ title: '是否使用AI辅助教学', rows: freqGroup('是否使用AI辅助教学', r => r.useAI || '(未填)') });
  } else {
    groups.push({ title: 'Edad', rows: freqGroup('Edad', r => {
      const age = parseInt(r.age) || 0;
      if (age <= 14) return '14 años o menos';
      if (age <= 18) return '15-18 años';
      if (age <= 25) return '19-25 años';
      if (age <= 35) return '26-35 años';
      return '36 años o más';
    }) });
    groups.push({ title: 'Género', rows: freqGroup('Género', r => r.gender || '(Sin dato)') });
    groups.push({ title: 'Tiempo estudiando chino', rows: freqGroup('Tiempo estudiando chino', r => r.studyDuration || '(Sin dato)') });
    groups.push({ title: 'Nivel de chino', rows: freqGroup('Nivel de chino', r => r.hskLevel || '(Sin dato)') });
    groups.push({ title: 'Objetivo de estudio（多选）', rows: freqGroup('Objetivo de estudio（多选）', r => r.studyPurpose || [], true) });
    groups.push({ title: 'Frecuencia de uso de herramientas digitales', rows: freqGroup('Frecuencia de uso de herramientas digitales', r => r.toolFreq || '(Sin dato)') });
    groups.push({ title: 'Herramientas utilizadas（多选）', rows: freqGroup('Herramientas utilizadas（多选）', r => r.toolsUsed || [], true) });
  }

  // Render three-line table
  let html = '<table class="three-line-table"><thead><tr>';
  html += '<th style="width:25%;">基本信息</th><th style="width:35%;">类目</th><th style="width:15%;">人数</th><th style="width:25%;">占比 (%)</th>';
  html += '</tr></thead><tbody>';

  groups.forEach(group => {
    group.rows.forEach((row, i) => {
      html += '<tr>';
      if (i === 0) {
        html += `<td class="cat" rowspan="${group.rows.length}">${group.title}</td>`;
      }
      html += `<td>${row.option}</td><td>${row.count}</td><td>${row.pct}</td>`;
      html += '</tr>';
    });
  });

  html += `<tr class="note-row"><td colspan="4">注：N = ${n}</td></tr>`;
  html += '</tbody></table>';

  container.innerHTML = html;
}

      const meanNum = vals.reduce((s,v)=>s+v,0)/n;
      const variance = vals.reduce((s,v)=>s+(v-meanNum)*(v-meanNum),0)/n;
      const sdNum = Math.sqrt(variance);
      const label = (allQs[qi-1]||'Q'+qi).slice(0, 20).padEnd(20);
      report += `${label}\t${n}\t${meanNum.toFixed(2)}\t${(n%2===0 ? ((vals[n/2-1]+vals[n/2])/2) : vals[Math.floor(n/2)]).toFixed(2)}\t${sdNum.toFixed(2)}\t${vals[0]}\t${vals[n-1]}\n`;
    }
    const alpha = calcAlpha(responses, mod.qStart, mod.qEnd);
    if (alpha !== null) {
      report += `\nCronbach's α = ${alpha.toFixed(3)} ${alpha>=0.7?'(良好)':'(偏低)'}\n`;
    }
    report += `\n`;
  });

  const blob = new Blob(['\uFEFF'+report], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `SPSS分析_${currentTab}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 分析报告已下载');
}

// ==== Export CSV ====
function exportCSV() {
  const responses = getResponses();
  if (responses.length === 0) { showToast('⚠️ 没有数据可导出'); return; }

  const questions = currentTab === 'teacher' ? teacherQuestions : studentQuestions;
  let csv = '\uFEFF'; // BOM for Excel

  // Headers
  let headers = ['序号', '提交时间'];
  if (currentTab === 'teacher') {
    headers.push('age', 'gender', 'teachYears', 'targetStudents', 'studentLevel', 'latinExp', 'teachLang', 'schoolType', 'useAI');
  } else {
    headers.push('age', 'gender', 'studyDuration', 'hskLevel', 'studyPurpose', 'studyPurposeOther', 'toolFreq', 'toolsUsed', 'toolsUsedOther');
  }
  const likertHeaders = questions.map((_, i) => `Q${i+1}`);
  csv += headers.concat(likertHeaders).join(',') + '\n';

  // Spanish-to-Chinese translation for student survey values
  const esToCn = {
    'Masculino': '男',
    'Femenino': '女',
    'Menos de 3 meses': '少于3个月',
    '3-6 meses': '3-6个月',
    '3–6 meses': '3-6个月',
    '6 meses - 1 a\u00f1o': '6个月-1年',
    '1-2 a\u00f1os': '1-2年',
    '1–2 años': '1-2年',
    'M\u00e1s de 2 a\u00f1os': '超过2年',
    'Principiante (sin base)': '初学者(无基础)',
    'HSK 1': 'HSK 1',
    'HSK 2': 'HSK 2',
    'HSK 3': 'HSK 3',
    'HSK 3 o superior': 'HSK 3及以上',
    'Inter\u00e9s personal': '个人兴趣',
    'Necesidad laboral': '工作需求',
    'Para viajar': '旅游',
    'Comunicarme con amigos chinos': '与华人朋友交流',
    'Conocer la cultura china': '了解中国文化',
    'Requisito de los padres': '父母要求',
    'Nunca': '从不',
    'Raramente': '很少',
    'A veces': '有时',
    'Con frecuencia': '经常',
    'Diccionario electr\u00f3nico': '电子词典',
    'Apps de aprendizaje de chino': '中文学习App',
    'Cursos en l\u00ednea': '在线课程',
    'Software de traducci\u00f3n': '翻译软件',
    'YouTube / Bilibili y otros videos': 'YouTube/Bilibili等视频',
    'ChatGPT u otras herramientas de IA': 'ChatGPT等AI工具',
    'No he usado ninguna': '未使用过任何工具',
    'Otro': '其他'
  };
  const translateVal = v => esToCn[v] || v;

  responses.forEach((r, idx) => {
    let row = [idx + 1, r.timestamp];
    if (currentTab === 'teacher') {
      row.push(r.age, r.gender || '', r.teachYears, (r.targetStudents || []).join(';'), (r.studentLevel || []).join(';'),
               r.latinExp, (r.teachLang || []).join(';'), r.schoolType, r.useAI);
    } else {
      row.push(r.age, translateVal(r.gender), translateVal(r.studyDuration), translateVal(r.hskLevel), (r.studyPurpose || []).map(translateVal).join(';'),
               r.studyPurposeOther || '', translateVal(r.toolFreq), (r.toolsUsed || []).map(translateVal).join(';'), r.toolsUsedOther || '');
    }
    questions.forEach((_, i) => {
      const k = `q${i + 1}`;
      row.push(r.likert && r.likert[k] !== null && r.likert[k] !== undefined ? r.likert[k] : '');
    });
    csv += row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentTab === 'teacher' ? '教师' : '学生'}问卷数据_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ CSV 已下载');
}

// ==== Import JSON ====
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.multiple = true;
  input.onchange = () => {
    const files = Array.from(input.files);
    let imported = 0;
    const existing = getResponses();

    Promise.all(files.map(f => f.text())).then(contents => {
      contents.forEach(text => {
        try {
          const data = JSON.parse(text);
          const items = Array.isArray(data) ? data : [data];
          items.forEach(item => {
            if (item.type === currentTab) {
              existing.push(item);
              imported++;
            }
          });
        } catch(e) {}
      });
      localStorage.setItem(getStorageKey(), JSON.stringify(existing));
      renderAll();
      showToast(`✅ 导入了 ${imported} 条记录`);
    });
  };
  input.click();
}

// ==== Copy link ====
function copyShareLink() {
  const links = {
    teacher: 'teacher_survey.html',
    student: 'student_survey.html'
  };
  const url = window.location.href.replace('data_viewer.html', links[currentTab]);
  navigator.clipboard.writeText(url).then(() => showToast('📋 链接已复制'));
}

// ==== Record key (same logic as dedup) ====
function getRecordKey(r) {
  return r.timestamp + (r.age || '') + (r.gender || r.teachYears || '');
}

// ==== Select / Delete individual records ====
function onSelectAll(e) {
  const checked = e.target.checked;
  document.querySelectorAll('#dataTable .row-checkbox').forEach(cb => {
    cb.checked = checked;
  });
  updateDeleteButton();
}

function onRowCheckboxChange() {
  updateDeleteButton();
  // Sync selectAll checkbox state
  const all = document.querySelectorAll('#dataTable .row-checkbox');
  const checked = document.querySelectorAll('#dataTable .row-checkbox:checked');
  const selectAll = document.getElementById('selectAll');
  if (selectAll) {
    selectAll.checked = all.length > 0 && checked.length === all.length;
    selectAll.indeterminate = checked.length > 0 && checked.length < all.length;
  }
}

function updateDeleteButton() {
  const checked = document.querySelectorAll('#dataTable .row-checkbox:checked');
  const btn = document.getElementById('btnDeleteSelected');
  const count = document.getElementById('deleteCount');
  if (btn) {
    btn.disabled = checked.length === 0;
  }
  if (count) {
    count.textContent = checked.length;
  }
}

function deleteSelected() {
  const checkboxes = document.querySelectorAll('#dataTable .row-checkbox:checked');
  if (checkboxes.length === 0) { showToast('请先选择要删除的记录'); return; }

  if (!confirm(`确定要删除选中的 ${checkboxes.length} 条记录吗？\n\n⚠️ 此操作不可恢复！建议先导出 CSV 备份。`)) return;

  const keysToDelete = new Set();
  checkboxes.forEach(cb => keysToDelete.add(cb.dataset.key));

  // Remove from localStorage
  const localData = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
  const newLocal = localData.filter(r => !keysToDelete.has(getRecordKey(r)));
  localStorage.setItem(getStorageKey(), JSON.stringify(newLocal));

  // Remove from cloudData cache
  cloudData[currentTab] = (cloudData[currentTab] || []).filter(r => !keysToDelete.has(getRecordKey(r)));

  // PUT updated data to JSONBin
  const payload = cloudData[currentTab].length > 0 ? cloudData[currentTab] : [{_empty: true}];
  fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BI[currentTab]}`, {
    method: 'PUT',
    headers: { 'X-Master-Key': JSONBIN_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => {});

  renderAll();
  showToast(`🗑️ 已删除 ${checkboxes.length} 条记录`);
}

// ==== Clear data ====
function clearData() {
  const responses = getResponses();
  if (responses.length === 0) { showToast('没有数据可清空'); return; }
  if (confirm(`确定要清空所有${currentTab === 'teacher' ? '教师' : '学生'}问卷数据（共 ${responses.length} 条记录）吗？\n\n⚠️ 此操作不可恢复！建议先导出 CSV 备份。`)) {
    localStorage.setItem(getStorageKey(), '[]');
    cloudData[currentTab] = [];
    fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BI[currentTab]}`, {
      method: 'PUT',
      headers: { 'X-Master-Key': JSONBIN_KEY, 'Content-Type': 'application/json' },
      body: '[{"_empty":true}]'
    }).catch(() => {});
    renderAll();
    showToast('🗑️ 数据已清空');
  }
}

// ==== Survey Toggle ====
const CONFIG_BIN_ID = '6a3d2840f5f4af5e292ed7a1';
let configStatus = { teacher_open: true, student_open: true };

function loadConfig() {
  fetch(`https://api.jsonbin.io/v3/b/${CONFIG_BIN_ID}/latest`, {
    headers: { 'X-Master-Key': JSONBIN_KEY }
  }).then(r => r.json()).then(j => {
    configStatus = j.record || { teacher_open: true, student_open: true };
    updateToggleButtons();
  }).catch(() => updateToggleButtons());
}

function updateToggleButtons() {
  const tb = document.getElementById('btnTeacherToggle');
  const sb = document.getElementById('btnStudentToggle');
  if (tb) {
    tb.textContent = '🧑‍🏫 教师问卷：' + (configStatus.teacher_open ? '已开启 ✅' : '已关闭 ⏸️');
    tb.className = configStatus.teacher_open ? 'btn btn-green' : 'btn btn-danger';
  }
  if (sb) {
    sb.textContent = '👩‍🎓 学生问卷：' + (configStatus.student_open ? '已开启 ✅' : '已关闭 ⏸️');
    sb.className = configStatus.student_open ? 'btn btn-green' : 'btn btn-danger';
  }
}

function toggleSurvey(type) {
  const key = type === 'teacher' ? 'teacher_open' : 'student_open';
  configStatus[key] = !configStatus[key];
  fetch(`https://api.jsonbin.io/v3/b/${CONFIG_BIN_ID}`, {
    method: 'PUT',
    headers: { 'X-Master-Key': JSONBIN_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(configStatus)
  }).then(() => {
    updateToggleButtons();
    showToast(`✅ ${type==='teacher'?'教师':'学生'}问卷已${configStatus[key]?'开启':'关闭'}`);
  }).catch(() => {
    configStatus[key] = !configStatus[key]; // revert
    showToast('⚠️ 操作失败，请重试');
  });
}

// ==== Toast ====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ==== Load ====
populateModuleFilter();
renderAll();
loadConfig();
</script>
